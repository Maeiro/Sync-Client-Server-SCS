plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'com.gradleup.shadow' version '9.1.0'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', mod_id

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {}

        server {
            arg '--nogui'
        }

        gameTestServer {}

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/Resources/')
        }
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/Resources', 'src/generated/resources']
        }
    }
}

mixin {
    add sourceSets.main, 'scs.refmap.json'
    config 'scs.mixins.json'
}

configurations {
    runtimeClasspath.extendsFrom localRuntime

    shadowImplementation {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation 'com.moandjiezana.toml:toml4j:0.7.2'
    implementation 'org.json:json:20231013'

    shadowImplementation 'com.moandjiezana.toml:toml4j:0.7.2'
    shadowImplementation 'org.json:json:20231013'

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version_range    : forge_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description
]

tasks.named('processResources', ProcessResources).configure {
    dependsOn tasks.named('compileJava')
    exclude 'META-INF/neoforge.mods.toml'
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
    from("$buildDir/tmp/compileJava/compileJava-refmap.json") {
        rename { 'scs.refmap.json' }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.named('jar', Jar).configure {
    enabled = false
}

tasks.named('shadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar).configure {
    archiveClassifier.set('')

    configurations = [project.configurations.shadowImplementation]
    dependencies {
        include(dependency('com.moandjiezana.toml:toml4j'))
        include(dependency('org.json:json'))
    }

    relocate 'com.moandjiezana.toml', 'com.scs.shaded.toml'
    relocate 'com.moandjiezana.github.oshi', 'com.scs.github.oshi'
    relocate 'org.json', 'com.scs.shaded.json'

    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    exclude 'test/**', '**/Test*.class', '**/*Test.class'

    manifest {
        attributes(
                'Specification-Title': mod_id,
                'Specification-Vendor': mod_authors,
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs': 'scs.mixins.json'
        )
    }
}

reobf {
    shadowJar {}
}

tasks.named('assemble').configure {
    dependsOn tasks.named('reobfShadowJar')
}

tasks.named('build').configure {
    dependsOn tasks.named('reobfShadowJar')
}


tasks.matching { it.name == 'reobfJar' }.configureEach {
    enabled = false
}

